version: "3.9"
services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "4000:4000"
    environment:
      - DATABASE_URL=postgresql://metaluser:metalpass@postgres:5432/metaldb
      - REDIS_URL=redis://redis:6379
      - N8N_WEBHOOK_URL=http://n8n:5678/webhook
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - ANTHROPIC_BASE_URL=${ANTHROPIC_BASE_URL}
      - IMAP_HOST=${IMAP_HOST}
      - IMAP_USER=${IMAP_USER}
      - IMAP_PASS=${IMAP_PASS}
      - SMTP_HOST=${SMTP_HOST}
      - ERP_METAL_URL=${ERP_METAL_URL}
      - OLLAMA_URL=http://ollama:11434
      - OCR_SERVICE_URL=http://tesseract:8868
      - UPLOAD_DIR=/app/uploads
      - JWT_SECRET=${JWT_SECRET}
      - CORS_ORIGIN=${CORS_ORIGIN:-http://localhost:3000}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - NODE_ENV=${NODE_ENV:-production}
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - metalnet
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - metalnet
    restart: unless-stopped

  postgres:
    image: postgres:15-alpine
    ports:
      - "5433:5432"
    environment:
      - POSTGRES_USER=metaluser
      - POSTGRES_PASSWORD=metalpass
      - POSTGRES_DB=metaldb
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U metaluser -d metaldb"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - metalnet
    restart: unless-stopped

  # Scheduled database backup — runs daily at 02:00
  # Manual run: docker compose run --rm backup
  backup:
    image: postgres:15-alpine
    environment:
      - DATABASE_URL=postgresql://metaluser:metalpass@postgres:5432/metaldb
      - BACKUP_DIR=/backups
      - BACKUP_KEEP_DAYS=7
    volumes:
      - ./scripts/backup.sh:/usr/local/bin/backup.sh:ro
      - backups_data:/backups
    entrypoint: ["/bin/sh", "-c"]
    command: >
      "echo '0 2 * * * DATABASE_URL=postgresql://metaluser:metalpass@postgres:5432/metaldb BACKUP_DIR=/backups BACKUP_KEEP_DAYS=7 /usr/local/bin/backup.sh >> /var/log/backup.log 2>&1' | crontab -
      && crond -f -l 8"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - metalnet
    restart: unless-stopped

  n8n:
    image: n8nio/n8n:latest
    ports:
      - "5678:5678"
    environment:
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=admin
      - N8N_BASIC_AUTH_PASSWORD=${N8N_PASSWORD:-metaln8n}
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=metaldb
      - DB_POSTGRESDB_USER=metaluser
      - DB_POSTGRESDB_PASSWORD=metalpass
      - DB_POSTGRESDB_SCHEMA=n8n
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY:-changeme-in-production}
      - WEBHOOK_URL=http://localhost:5678
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - metalnet
    restart: unless-stopped

  tesseract:
    build: ./tesseract
    container_name: tesseract
    networks:
      - metalnet
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - metalnet
    restart: unless-stopped

networks:
  metalnet:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  n8n_data:
  ollama_data:
  uploads_data:
  backups_data:
