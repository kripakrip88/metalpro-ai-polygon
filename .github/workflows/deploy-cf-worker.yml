name: Deploy Cloudflare Worker

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'cloudflare-worker/**'
      - 'wrangler.toml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: a17931e8615574d21c0eef43a4a0ff33
          workingDirectory: cloudflare-worker

      - name: Print Worker URL
        run: echo "Worker deployed to https://anthropic-proxy.$(curl -s https://api.cloudflare.com/client/v4/accounts/a17931e8615574d21c0eef43a4a0ff33/workers/subdomains -H 'Authorization: Bearer ${{ secrets.CF_API_TOKEN }}' | python3 -c 'import sys,json; d=json.load(sys.stdin); print(d[\"result\"][\"subdomain\"])').workers.dev"
