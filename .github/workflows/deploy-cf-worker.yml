name: Deploy Cloudflare Worker

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'cloudflare-worker/**'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Wrangler
        run: npm install -g wrangler

      - name: Deploy Worker
        working-directory: cloudflare-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: a17931e8615574d21c0eef43a4a0ff33
        run: wrangler deploy

      - name: Print Worker URL
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: |
          SUBDOMAIN=$(curl -sf https://api.cloudflare.com/client/v4/accounts/a17931e8615574d21c0eef43a4a0ff33/workers/subdomains \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" | python3 -c 'import sys,json; print(json.load(sys.stdin)["result"]["subdomain"])')
          URL="https://anthropic-proxy.${SUBDOMAIN}.workers.dev"
          echo "✅ Worker deployed!"
          echo "ANTHROPIC_BASE_URL=${URL}"
          echo "${URL}" >> $GITHUB_STEP_SUMMARY
